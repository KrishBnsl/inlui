[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seatcraft-inference-api"
version = "0.1.0"
description = "FastAPI inference service for SeatCraft recommendations."
requires-python = ">=3.12"
dependencies = [
  "seatcraft-josaa-core==0.1.0",
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.3",
  "python-multipart==0.0.20",
  "scikit-learn==1.6.1",
  "joblib==1.5.0",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "python-dotenv==1.1.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
]

[tool.setuptools.packages.find]
where = ["src"]
