name: inlui

services:
  inference-api:
    build:
      context: .
      dockerfile: apps/inference-api/Dockerfile
    restart: unless-stopped
    environment:
      RESEARCH_DIR: /app/research
      DATA_DIR: /app/research/data
      ARTIFACTS_DIR: /app/research/artifacts
      MC_N_SIMS: "${MC_N_SIMS:-1000}"
    ports:
      - "${INFERENCE_PORT:-8082}:8082"
    volumes:
      - ./research:/app/research:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8082/api/v1/health',timeout=3));
          raise SystemExit(0 if data.get('artifacts_loaded') else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rag-api:
    build:
      context: ./apps/rag-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      RAG_LLM_MODEL: "${RAG_LLM_MODEL:-gemini-2.5-flash}"
      RAG_LLM_TEMPERATURE: "${RAG_LLM_TEMPERATURE:-0.2}"
      RAG_LLM_MAX_TOKENS: "${RAG_LLM_MAX_TOKENS:-1024}"
      RAG_EMBED_MODEL: "${RAG_EMBED_MODEL:-models/gemini-embedding-2}"
      RAG_TOP_K: "${RAG_TOP_K:-5}"
      RAG_CHUNK_SIZE: "${RAG_CHUNK_SIZE:-512}"
      RAG_CHUNK_OVERLAP: "${RAG_CHUNK_OVERLAP:-64}"
      RAG_REQUEST_TIMEOUT_SECONDS: "${RAG_REQUEST_TIMEOUT_SECONDS:-20}"
      RAG_PROVIDER_TIMEOUT_SECONDS: "${RAG_PROVIDER_TIMEOUT_SECONDS:-12}"
      RAG_MAX_UPLOAD_BYTES: "${RAG_MAX_UPLOAD_BYTES:-10485760}"
      RAG_MAX_INLINE_IMAGE_BYTES: "${RAG_MAX_INLINE_IMAGE_BYTES:-5242880}"
      RAG_MAX_ML_CONTEXT_CHARS: "${RAG_MAX_ML_CONTEXT_CHARS:-20000}"
    ports:
      - "${RAG_PORT:-8081}:8081"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=3));
          raise SystemExit(0 if data.get('status') in ('ok','degraded') else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ML_URL: "${NEXT_PUBLIC_ML_URL:-http://localhost:8082}"
        NEXT_PUBLIC_RAG_URL: "${NEXT_PUBLIC_RAG_URL:-http://localhost:8081}"
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      inference-api:
        condition: service_healthy
      rag-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Optional collaborator-contributed Rust/PostgreSQL experiment. It is never
  # part of the default Python application and requires an explicit profile.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["rust-sim"]
    environment:
      POSTGRES_DB: inlui
      POSTGRES_USER: inlui
      POSTGRES_PASSWORD: "${RUST_SIM_POSTGRES_PASSWORD:-inlui_local_only}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inlui -d inlui"]
      interval: 5s
      timeout: 5s
      retries: 10

  rust-ingest:
    build:
      context: ./optional/rust-sim
      dockerfile: Dockerfile
    profiles: ["rust-sim"]
    command: ["./ingest"]
    working_dir: /app
    environment:
      DATABASE_URL: "postgres://inlui:${RUST_SIM_POSTGRES_PASSWORD:-inlui_local_only}@postgres:5432/inlui"
    volumes:
      - ./optional/rust-sim/merged_jee_cutoff_2018_2025.csv:/app/merged_jee_cutoff_2018_2025.csv:ro
    depends_on:
      postgres:
        condition: service_healthy

  rust-server:
    build:
      context: ./optional/rust-sim
      dockerfile: Dockerfile
    profiles: ["rust-sim"]
    restart: unless-stopped
    command: ["./server"]
    working_dir: /app
    environment:
      DATABASE_URL: "postgres://inlui:${RUST_SIM_POSTGRES_PASSWORD:-inlui_local_only}@postgres:5432/inlui"
      PORT: "8080"
    ports:
      - "${RUST_SIM_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rust-ingest:
        condition: service_completed_successfully

volumes:
  postgres_data:
