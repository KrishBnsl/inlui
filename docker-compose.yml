version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: inlui_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inlui
      POSTGRES_USER: inlui
      POSTGRES_PASSWORD: inlui_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inlui -d inlui"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Rust sim_engine — ingest (run once to populate the DB) ──────────────────
  ingest:
    build:
      context: ./sim_engine
      dockerfile: Dockerfile
    container_name: inlui_ingest
    command: ["./ingest"]
    working_dir: /app
    environment:
      DATABASE_URL: postgres://inlui:inlui_secret@postgres:5432/inlui
    volumes:
      - ./sim_engine/merged_jee_cutoff_2018_2025.csv:/app/merged_jee_cutoff_2018_2025.csv:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - ingest          # only run via: docker compose --profile ingest up ingest

  # ── Rust sim_engine — HTTP API server ──────────────────────────────────────
  server:
    build:
      context: ./sim_engine
      dockerfile: Dockerfile
    container_name: inlui_server
    restart: unless-stopped
    command: ["./server"]
    working_dir: /app
    environment:
      DATABASE_URL: postgres://inlui:inlui_secret@postgres:5432/inlui
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Python RAG service — LangChain + FastAPI ────────────────────────────────
  rag:
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    container_name: inlui_rag
    restart: unless-stopped
    env_file:
      - ./rag_service/.env
    environment:
      RAG_LLM_MODEL: gemini-2.5-flash
      RAG_LLM_TEMPERATURE: "0.2"
      RAG_EMBED_MODEL: models/text-embedding-004
      RAG_TOP_K: "5"
      RAG_CHUNK_SIZE: "512"
      RAG_CHUNK_OVERLAP: "64"
    ports:
      - "8081:8081"

  # ── Python ML Inference service — FastAPI ─────────────────────────────────────
  inference:
    build:
      context: .
      dockerfile: inference_service/Dockerfile
    container_name: inlui_inference
    restart: unless-stopped
    environment:
      MODELS_DIR: /app/models
      DATA_DIR: /app/models/data
      ARTIFACTS_DIR: /app/models/model_artifacts
    ports:
      - "8082:8082"
    volumes:
      - ./models:/app/models:ro

  # ── Next.js frontend ────────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: inlui_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci --fetch-retries=10 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_ML_URL: http://localhost:8082
      NEXT_PUBLIC_RAG_URL: http://localhost:8081
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./seatcraft:/app
      - seatcraft_node_modules:/app/node_modules
    depends_on:
      - inference
      - rag

volumes:
  postgres_data:
  seatcraft_node_modules:
